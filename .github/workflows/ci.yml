name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-links:
    name: Lint, format check & link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Link check (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude '^#' --exclude 'mailto:' './**/*.html' './**/*.md'
          fail: true
