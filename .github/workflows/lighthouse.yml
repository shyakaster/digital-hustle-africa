name: Lighthouse

# On-demand + weekly performance/accessibility audit.
# Doesn't block PRs — results upload as artifacts.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit (static preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Serve site
        run: |
          python3 -m http.server 8080 --directory . &
          echo $! > /tmp/server.pid
          sleep 2

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid) || true
